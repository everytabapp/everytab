<head>
<meta charset="utf-8" />
<title>EveryTab shell harness</title>
<!--
  D4 VISUAL HARNESS. Not shipped behavior, not a second implementation.

  Claude in Chrome (and most browser automation) refuses chrome-extension:// and
  file:// URLs, and dashboard.js cannot run outside an extension context because
  it needs chrome.*. This page is the bridge: it loads the REAL stylesheets and
  mirrors the exact class names and DOM order dashboard.js/tablist.js produce,
  so the shell can be rendered, resized, re-themed, and screenshotted over plain
  http during a design wave.

  Serve it from the extension folder and open it:
    cd extension && python3 -m http.server 8765
    http://localhost:8765/tools/shell-harness.html

  It carries NO product logic. If markup here drifts from the real renderers,
  the harness is wrong, not the product. Re-check it against js/ui/tablist.js
  and js/ui/dashboard.js when a wave changes shared DOM.
-->
<!-- Cache-busted on purpose: during a design wave the stylesheets change between
     every screenshot, and a cached sheet silently shows the previous build. -->
<script>
  for (const name of ["tokens", "primitives", "dashboard", "tablist-d4"]) {
    document.write('<link rel="stylesheet" href="../css/' + name + '.css?t=' + Date.now() + '" />');
  }
</script>

<script type="module">
import { icon } from "../js/ui/icons.js";
/* Mirrors js/lib/nav-mode.js exactly, so resizing this harness reproduces the
   production presentation. Kept as two literals for the same reason boot.js
   keeps them: this document cannot import the module. */
const NAV_COMPACT_MAX = 900, NAV_HEADER_MAX = 620;
const root = document.documentElement;
/* Production resolves the mode from two matchMedia queries and re-resolves on
   their `change` event. The harness deliberately does NOT attach those
   listeners: mutating the DOM mid-capture makes screenshot tooling time out.
   Instead `applyNavMode()` is exported and called explicitly after a resize,
   which reaches the same states under the same two numbers. The resolution
   itself is covered by resolveNavMode's unit tests, not by this page. */
const compactQ = matchMedia("(max-width: " + NAV_COMPACT_MAX + "px)");
const headerQ = matchMedia("(max-width: " + NAV_HEADER_MAX + "px)");
window.applyNavMode = applyNavMode;
function applyNavMode() {
  const collapsed = root.dataset.sidebar === "collapsed";
  root.dataset.nav = headerQ.matches ? "header"
    : (compactQ.matches || collapsed) ? "rail" : "expanded";
  const btn = document.querySelector(".nav-collapse");
  btn.setAttribute("aria-expanded", String(!collapsed));
  btn.setAttribute("aria-label", collapsed ? "Expand navigation" : "Collapse navigation");
  btn.hidden = compactQ.matches || headerQ.matches;
  btn.replaceChildren(icon(collapsed ? "navexpand" : "navcollapse", 16));
}
let navMotion = null;
function clearNavMotion(motion = navMotion) {
  if (!motion) return;
  motion.animations.forEach((animation) => animation.cancel());
  motion.backdrop.remove();
  if (navMotion === motion) {
    navMotion = null;
    root.classList.remove("nav-morphing");
  }
}
document.querySelector(".nav-collapse").addEventListener("click", () => {
  const next = root.dataset.sidebar === "collapsed" ? "expanded" : "collapsed";
  const publish = () => {
    root.dataset.sidebar = next;
    applyNavMode();
  };
  if (typeof Element.prototype.animate !== "function" ||
      matchMedia("(prefers-reduced-motion: reduce)").matches) {
    clearNavMotion();
    publish();
    return;
  }
  const sidebar = document.querySelector(".sidebar");
  const liveSidebarRect = navMotion?.backdrop.isConnected
    ? navMotion.backdrop.getBoundingClientRect()
    : sidebar.getBoundingClientRect();
  clearNavMotion();
  publish();
  const finalSidebarRect = sidebar.getBoundingClientRect();
  const startWidth = Math.max(1, liveSidebarRect.width);
  const backdrop = document.createElement("div");
  backdrop.className = "nav-resize-backdrop";
  Object.assign(backdrop.style, {
    left: `${liveSidebarRect.left}px`, top: `${liveSidebarRect.top}px`,
    width: `${startWidth}px`,
    height: `${Math.max(liveSidebarRect.height, finalSidebarRect.height)}px`
  });
  sidebar.before(backdrop);
  root.classList.add("nav-morphing");
  const motionStyle = getComputedStyle(root);
  const timing = {
    duration: parseFloat(motionStyle.getPropertyValue("--motion-continuity")) || 180,
    easing: motionStyle.getPropertyValue("--ease-out").trim() || "cubic-bezier(.2, .8, .2, 1)",
    fill: "both"
  };
  const animations = [
    backdrop.animate([
      { transform: "scaleX(1)" },
      { transform: `scaleX(${Math.max(1, finalSidebarRect.width) / startWidth})` }
    ], timing),
    sidebar.animate([{ opacity: .16 }, { opacity: 1 }], timing)
  ];
  const motion = { animations, backdrop };
  navMotion = motion;
  Promise.allSettled(animations.map((animation) => animation.finished)).then(() => {
    if (navMotion === motion) clearNavMotion(motion);
  });
});
document.querySelector(".skip-link").addEventListener("click", () => document.getElementById("main").focus());

   would make this page lie about the state it exists to show. */

   query that collapses labels to icons below 720px behaves as it really does. */

const TWIST = '<span class="twist" role="button" tabindex="0" aria-label="Toggle">▶</span>';

/* F39: one static snapshot in the flat edge rail and responsive top-right
   attention line. Live CRUD, persistence, and routing stay in command-box.js. */
const STARS = ["AI Bench", "Design notes", "EveryTab backlog", "Client review", "Chrome APIs"];
const starRow = (name) => '<div class="pu-star-row"><button class="pu-star-link">' +
  '<span class="pu-fav cmd-fav-blank"></span><span>' + name + '</span></button>' +
  '<span class="pu-row-actions"><button class="pu-row-action" aria-label="Rename ' + name + '">' +
  ICON("rename") + '</button><button class="pu-row-action" aria-label="Unstar ' + name + '">×</button></span></div>';
document.getElementById("starred-icon").appendChild(icon("star", 15));
document.getElementById("starred-list").innerHTML = STARS.map(starRow).join("");
document.querySelector(".starred-edge-toggle").addEventListener("click", () => {
  const edge = document.getElementById("starred-edge");
  const update = () => {
    edge.classList.toggle("is-open");
    edge.querySelector(".starred-edge-toggle")
      .setAttribute("aria-expanded", String(edge.classList.contains("is-open")));
  };
  if (document.startViewTransition &&
      !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.startViewTransition(update);
  } else update();
});
document.getElementById("attention-items").innerHTML =
  '<span class="page-attention-entry"><button class="page-attention-link"><span class="page-attention-copy">Reconnect Vault</span></button></span>' +
  '<span class="page-attention-entry"><button class="page-attention-link"><span class="page-attention-copy">3 duplicates</span></button></span>' +
  '<span class="page-attention-entry is-automatic"><button class="page-attention-link">' +
    ICON("refresh") + '<span class="page-attention-copy">Auto-saved 4 tabs to the Inbox</span>' +
    '<span class="page-attention-age">8m ago</span></button><button class="page-attention-undo">Undo</button></span>' +
  '<button class="page-attention-activity">All activity</button>';

function navItem(label, count, active, group, glyph) {
  const name = count === undefined ? label : label + ", " + count;
  return '<button class="navitem' + (active ? " active" : "") + '" aria-label="' + name +
    '" data-tip="' + name + '"' + (active ? ' aria-current="page"' : "") + '>' + ICON(glyph) +
    '<span class="navtext">' + label + "</span>" +
    (count === undefined ? "" : '<span class="n">' + count + "</span>") +
    (group ? TWIST : "") + "</button>";
}
function navGroup(label, count, subs, glyph) {
  return '<div class="navgroup open">' + navItem(label, count, false, true, glyph) +
    '<div class="subnav"><div>' + subs.map((s) =>
      '<div class="subrow"><button class="navitem sub"><span class="navtext">' + s[0] +
      '</span><span class="n">' + s[1] + "</span></button>" +
      (label === "Sessions" ? '<button class="subact" aria-label="Restore session ' + s[0] + '">' + ICON("switch") + '</button>' : '') +
      "</div>").join("") +
    "</div></div></div>";
}
document.getElementById("nav-main").innerHTML =
  navItem("Open tabs", 147, true, false, "open") +
  navItem("Inbox", 38, false, false, "inbox") +
  navItem("Snoozed", 9, false, false, "snooze") +
  navItem("Duplicates", 12, false, false, "duplicates");
document.getElementById("nav-lib").innerHTML =
  navGroup("Sessions", 6, [["Monday research setup", 14], ["Client review", 8]], "sessions") +
  navGroup("Labels", 18, [["reading list", 42], ["invoices 2026", 7]], "labels") +
  navItem("Archive", 1284, false, false, "archive") +
  navItem("Snapshots", 24, false, false, "snapshots");
document.getElementById("nav-more").innerHTML =

  navItem("Activity", undefined, false, false, "activity") +
  navItem("Export / Import", undefined, false, false, "data") +
  navItem("Vault", undefined, false, false, "vault") +
  navItem("Settings", undefined, false, false, "settings");

const TABS = [
  ["Calm Precision design system specification", "vercel.com"],
  ["A very long tab title that has to truncate before the action lane does, because titles lose first", "developer.mozilla.org"],
  ["chrome.sidePanel API reference", "developer.chrome.com"],
  ["Inbox (38)", "mail.google.com"],
  ["EveryTab backlog", "github.com"]
];
function row(t, host, sel) {
  return '<div class="trow selrow' + (sel ? " sel" : "") + '" data-tablist-row="r">' +
    '<span class="row-select-slot"><input type="checkbox" aria-label="Select ' + host + '"' +
      (sel ? " checked" : "") + " /></span>" +
    '<span class="fv-placeholder" aria-hidden="true"></span>' +
    '<span class="row-copy"><span class="t"><a href="#">' + t + "</a></span>" +
      '<span class="row-subline"><span class="host">' + host + "</span></span></span>" +
    '<span class="row-chip-slot"><span class="rowchips chips"><span class="chip"><button class="chiplink" type="button" aria-label="Show label reading list in the Labels section">reading list</button></span></span></span>' +
    '<span class="tacts">' +
      ACT("Inbox", "inbox") + ACT("Label", "labels") + ACT("Snooze", "snooze") +
      ACT("Suspend", "suspend") + ACT("Close", "duplicates") + "</span></div>";
}
function windowCard(n, meta, sel) {
  const armedClose = new URLSearchParams(location.search).get("windowclose") === "armed" && n === 1;
  const closeControl = armedClose
    ? '<span class="confirm-inline window-close-confirm armed">' +
      '<span class="confirm-copy"><span class="confirm-primary">Close Window 1 and its 5 tabs?</span>' +
      '<span class="confirm-detail">1 pinned tab is included. This also closes EveryTab.</span></span>' +
      '<span class="confirm-actions"><button class="danger" type="button"><span class="action-icon">×</span>' +
      '<span class="action-label">Close 5 tabs</span></button><button class="mini2" type="button">' +
      '<span class="action-label">Cancel</span></button></span></span>'
    : '<span class="confirm-inline window-close-confirm"><button class="danger" type="button" ' +
      'title="Close window" aria-label="Close Window ' + n + '" data-action-id="close-window">' +
      '<span class="action-icon">×</span><span class="action-label">Close</span></button></span>';
  const head = '<div class="item-head">' +
    '<input type="checkbox" aria-label="Select all tabs of ' + meta + '" />' +
    '<span class="item-title">Window ' + n + "</span>" +
    '<span class="item-meta">' + meta + "</span>" +
    '<span class="gacts">' + ACT("Inbox", "inbox") + ACT("Session", "sessions") +
    ACT("Copy", "copy") + ACT("Organize", "organize") + closeControl + "</span></div>";
  return '<div class="item" data-tablist-card="window-' + n + '"><div class="item-head-shell">' + head +
    '</div><div class="item-body-frame"><div class="tl-rows">' +
    TABS.map((t, i) => row(t[0], t[1], sel && i === 1)).join("") + "</div></div></div>";
}
const windowCount = Math.max(2, Number(new URLSearchParams(location.search).get("windows")) || 2);
/* D4-3c: `?page=settings` renders the real Settings markup (settings-form.js
   shapes) so setting rows can be judged and measured at every width. */
const page = new URLSearchParams(location.search).get("page") || "open";
/* Production's router sets this on every route; page-scoped CSS keys off it. */
document.body.dataset.page = page;
document.body.dataset.workbench = String(["open", "inbox", "snoozed", "sessions", "labels", "duplicates"].includes(page));
if (page === "open") document.body.dataset.workbenchCollection = "open";
const sectionLead = (title, description, action = "") =>
  '<header class="section-lead"><div class="section-identity"><h2>' + title + '</h2>' +
  '<p class="sec-tagline">' + description + '</p></div>' +
  '<div class="section-actions" aria-label="Section actions">' + action + '</div></header>';
const INDEX_CHIPS = ["Research", "Client review", "Reading list", "Design", "Planning", "Reference",
  "Invoices", "Travel", "Ideas", "Documentation", "Later", "Purchases", "Newsletters", "Projects", "Tools", "Archive review"];
const indexBar = (noun) => '<div class="label-index section-local-sticky">' +
  '<div class="label-index-bar"><input class="label-filter" type="search" placeholder="Filter ' + noun + '…" />' +
  '<div class="label-sort"><button class="seg">A–Z</button><button class="seg">Most tabs</button>' +
  '<button class="seg on">Recent</button></div></div><div class="label-chip-line has-more">' +

const PAGES_HTML = {

    <div class="sec-wrap"><div class="sec-body"><div class="sec-inner">${indexBar("sessions")}

  <section>

    <div class="vault-row"><button>Change folder…</button><button>Sync now</button></div>

  data: `

      <button>Export Inbox (OneTab format)</button></div>

      <span class="item-meta">Nothing imported yet.</span></div>
  </section>`,
  onboarding: `<section><h2>Onboarding renders as an overlay below.</h2></section>`
};
document.getElementById("sections").innerHTML = PAGES_HTML[page] ?? (page === "settings" ? `
  <section>
    <h2>Settings</h2>
    <div class="setlist">
      <div class="settings-toolbar">
        <input class="settings-filter" placeholder="Filter settings…" />
        <div class="settings-nav">

          <div class="d">Strength of active and selected states.</div></span>

        <div class="setrow"><span class="tw"><div class="t">Corner style</div>
          <div class="d">Shared corner profile across every control.</div></span>

        <div class="setrow"><span class="tw"><div class="t">Section descriptions</div>

          <input type="checkbox" checked /></div>
      </section>
      <section class="settings-group">
        <h3>Auto-save</h3>
        <div class="setrow"><span class="tw"><div class="t">Suspend after</div>
          <div class="d">Free memory from tabs you have not touched in a while.</div></span>
          <div class="slider"><div class="slider-row">
            <input class="slider-range" type="range" />
            <span class="slider-value">1 hour</span></div>
            <div class="slider-ticks"><span>15m</span><span>1h</span><span>4h</span><span>Never</span></div>
          </div></div>
        <div class="setrow"><span class="tw"><div class="t">Never suspend these sites</div>
          <div class="d">One domain per line. Subdomains are covered too.</div></span>
          <input type="text" value="mail.google.com" /></div>
      </section>
      <section class="settings-group">
        <h3>Vault</h3>
        <div class="setrow"><span class="tw"><div class="t">Folder</div>
          <div class="d">iCloud Drive/EveryTab/vault</div></span>
          <button>Change…</button></div>
        <div class="setrow"><span class="tw"><div class="t">Preserve tab groups</div>
          <div class="d">Save and restore Chrome tab group names and colors.
            <div class="perm-note">Needs the tab groups permission.</div></div></span>
          <button>Allow</button></div>
      </section>
    </div>
  </section>` : `
  <section data-sec="open">
    ${sectionLead("Open tabs (147)", "Everything open in Chrome right now, window by window.")}
    <div class="sec-wrap"><div class="sec-body"><div class="sec-inner">
      <div class="tablist" data-tablist="open" id="tablist"></div>
    </div></div></div>
  </section>`);
if (page === "onboarding") {
  document.body.insertAdjacentHTML("beforeend", `
    <div class="ob-overlay"><div class="ob-card tour">
      <div class="ob-head"><span class="ob-brand">EveryTab</span>
        <button class="mini2">Skip</button></div>
      <div class="ob-body-host"><div class="ob-body">
        <h2>Your Inbox</h2>
        <div class="ob-essence">Everything EveryTab closes lands here first.</div>
        <p>Nothing is ever deleted behind your back. Tabs you save, and tabs that
          get saved automatically when a window sits idle, arrive in one place.</p>
        <ul class="ob-how"><li>Save a tab or a whole window from the toolbar popup.</li>
          <li>Triage from the dashboard: restore, label, snooze, or archive.</li>
          <li>Anything you archive stays findable by label and by search.</li></ul>
        <p class="ob-example">Example: close 30 research tabs, keep every one of them.</p>
        <div class="ob-settings">
          <div class="ob-set"><span class="ob-set-label">Auto-save idle windows after</span>
            <div class="slider"><div class="slider-row">
              <input class="slider-range" type="range" /><span class="slider-value">7 days</span>
            </div></div></div>
        </div>
      </div></div>
      <div class="ob-foot"><button>Back</button><button class="primary">Next</button>
        <span class="ob-dots"><span class="ob-dot"></span><span class="ob-dot on"></span>
          <span class="ob-dot"></span><span class="ob-dot"></span></span></div>
    </div></div>`);
}
if (["open", "sessions", "labels"].includes(page)) document.getElementById("tablist").innerHTML =
  '<div class="bulk-bar is-empty"></div><div class="keeper-panel-slot"></div>' +
  windowCard(1, "5 tabs · current window", true) +
  Array.from({ length: windowCount - 1 }, (_, i) => windowCard(i + 2, "5 tabs", false)).join("");
document.querySelectorAll(".label-index-toggle").forEach((toggle) => {
  toggle.addEventListener("click", () => {
    const line = toggle.closest(".label-chip-line");
    const open = line.classList.toggle("is-expanded");
    line.querySelectorAll(".label-chip").forEach((chip, i) => { chip.style.display = open || i < 10 ? "" : "none"; });
    toggle.setAttribute("aria-expanded", String(open));
    toggle.textContent = open ? "Show less" : "+6 more";
    requestAnimationFrame(() => {
      const local = document.querySelector(".section-local-sticky");
      root.style.setProperty("--section-local-h", (local?.getBoundingClientRect().height || 0) + "px");
    });
  });
});

/* State is addressable by query string so every variant is a fresh navigation.
   Screenshot tooling injects at document_idle and times out if the DOM mutates
   under it, so "navigate, then capture" is the reliable loop. Example:
     ?collapsed=1&scheme=matcha&mode=dark&emphasis=muted&corner=soft&focus=off */
const p = new URLSearchParams(location.search);
if (p.get("compact") === "1") document.getElementById("tablist")?.setAttribute("data-compact", "");
if (p.get("collapsed") === "1") root.dataset.sidebar = "collapsed";
if (p.get("stars") === "closed") {
  document.getElementById("starred-edge").classList.remove("is-open");
  document.querySelector(".starred-edge-toggle").setAttribute("aria-expanded", "false");
}
/* `w` simulates a viewport width by constraining the shell, because automated
   browsers cannot always resize the real viewport. Every responsive rule in the
   shell keys off `data-nav`, which is resolved from the same two numbers, so a
   constrained shell lays out exactly as that width would. */
const w = Number(p.get("w"));
if (w > 0) {
  document.getElementById("app").style.width = w + "px";
  root.dataset.nav = w <= NAV_HEADER_MAX ? "header"
    : (w <= NAV_COMPACT_MAX || root.dataset.sidebar === "collapsed") ? "rail" : "expanded";
  document.querySelector(".nav-collapse").hidden = w <= NAV_COMPACT_MAX;
}
for (const [key, attr] of [["scheme", "scheme"], ["mode", "mode"],
  ["emphasis", "emphasis"], ["corner", "cornerStyle"],
  ["rowinfo", "rowInfo"], ["checkbox", "checkboxShape"], ["actions", "actionLabels"]]) {
  if (p.get(key)) root.dataset[attr] = p.get(key);
}
if (p.get("focus") === "off") {
  const strip = document.getElementById("focus-strip");
  strip.classList.add("access-only");
  strip.querySelectorAll(":scope > .fs-dot, :scope > .fs-name, :scope > .fs-time, :scope > .fs-counts")
    .forEach((node) => node.remove());
  const focusNav = document.querySelector(".nav-focus");
  focusNav.classList.remove("focus-active");
  focusNav.setAttribute("aria-label", "Start Focus");
  focusNav.replaceChildren(icon("play", 16), Object.assign(document.createElement("span"), {
    className: "navtext", textContent: "Start Focus"
  }));
}
if (p.get("access") === "off") document.querySelector("#focus-strip > .focus-access")?.remove();
if (p.get("focus") === "off" && p.get("access") === "off") {
  document.getElementById("focus-strip").classList.add("hidden");
}
if (["1", "combined", "session", "session-long", "scope-long", "meta-long", "empty", "ghosts"].includes(p.get("search"))) {
  const combinedSearch = p.get("search") === "combined";
  const sessionSearch = p.get("search") === "session" || p.get("search") === "session-long";
  const longSessionSearch = p.get("search") === "session-long";
  const longScopeSearch = p.get("search") === "scope-long";
  const longMetaSearch = p.get("search") === "meta-long";
  const emptySearch = p.get("search") === "empty";
  const ghostSearch = p.get("search") === "ghosts";
  document.querySelector(".search-input").value = ghostSearch ? "" : combinedSearch ? "l" : sessionSearch ? "client" : "you";
  if (longScopeSearch) {
    document.querySelector(".scope-chip-host").innerHTML =
      '<span class="chip search-scope-chip" title="Client review with an extraordinarily long quarterly planning session name">' +
      '<span class="search-scope-label">Client review with an extraordinarily long quarterly planning session name</span>' +
      '<button class="x" aria-label="Clear Session filter">×</button></span>';
  }
  const ordinaryRows = Array.from({ length: 10 }, (_, i) =>
    sessionSearch && i === 0
      ? '<div class="search-row selected"><span class="rtitle">' + (longSessionSearch
          ? 'Client review with an extraordinarily long quarterly planning session name that must truncate'
          : 'Client review') + '</span><span class="rmeta rmeta-count">3 windows · 18 tabs</span>' +
        '<span class="rtype rtype-session-entity">Restore</span></div>'
      : '<div class="search-row"><span class="rtitle">Search result ' + (i + 1) +
        ' with a representative longer tab title</span><span class="rmeta">' +
        (longMetaSearch && i === 0
          ? 'Client review with an extraordinarily long quarterly planning session name'
          : i < 2 ? 'open' : 'inbox') + '</span><span class="rtype ' + (i < 2 ? 'rtype-open' : '') + '">' +
        (i < 2 ? 'Switch' : 'Open') + '</span></div>');
  const ordinaryResults = ordinaryRows.join("");
  const optionList = '<div class="search-option-list" role="listbox" aria-label="Search results">';
  const syntaxButton = (prefix, value) => '<button class="ghost-chip" aria-label="' + prefix + ':' + value + '">' +
    '<span class="ghost-prefix">' + prefix + ':</span><span class="ghost-value">' + value + '</span></button>';
  document.querySelector(".search-results").innerHTML = ghostSearch
    ? '<div class="ghost-chips"><span class="ghost-hint">Jump to:</span>' +
      syntaxButton('in', 'open') + syntaxButton('in', 'snoozed') +
      '<span class="ghost-domain-slot">' + syntaxButton('domain', 'github.com') + '</span>' +
      '<span class="ghost-label-slot">' + syntaxButton('label', 'reading list') + syntaxButton('label', 'invoices 2026') + '</span></div>' +
      '<div class="search-recent"><div class="search-recent-label">Recent tabs</div>' + optionList +
      '<div class="search-option-group search-recent-group" role="group" aria-label="Recent tabs">' +
      ordinaryRows.slice(0, 6).join("") + '</div></div></div>'
    : emptySearch
    ? '<div class="empty search-empty-actions">No matches in this filter.</div>'
    : combinedSearch
      ? optionList +
        '<div class="search-option-group search-suggestion-group" role="group" aria-label="Suggestions">' +
        '<div class="search-row scope-suggest selected" role="option"><span class="rtitle">label:</span></div></div>' +
        '<div class="search-option-group search-result-group has-separator" role="group" aria-label="Results">' +
        ordinaryResults + '</div></div>'
      : optionList + '<div class="search-option-group search-result-group" role="group" aria-label="Results">' +
        ordinaryResults + '</div></div>';
  document.querySelector(".search-footer-count").textContent = ghostSearch
    ? "6 recent tabs"
    : emptySearch ? "0 results" : "10 results";
  if (p.get("history") === "off") {
    const footer = document.querySelector(".search-footer");
    footer.classList.add("has-history-invite");
    footer.insertAdjacentHTML("beforeend", '<a class="tip">Include browser history</a>');
  }
  if (longSessionSearch) {
    const heroPanel = document.querySelector(".hero-panel");
    heroPanel.style.width = "380px";
    heroPanel.style.maxWidth = "380px";
  }
}
if (p.get("gradient") === "1") document.body.classList.add("gradient");
document.getElementById("brand-mark").appendChild(icon("mark", 20));
if (!(w > 0)) applyNavMode();
else document.querySelector(".nav-collapse")
  .replaceChildren(icon(root.dataset.sidebar === "collapsed" ? "navexpand" : "navcollapse", 16));
root.style.setProperty("--hero-h", document.querySelector(".hero").offsetHeight + "px");
const activeLead = document.querySelector(".section-lead");
const activeLocal = document.querySelector(".section-local-sticky");
root.style.setProperty("--section-lead-h", (activeLead?.getBoundingClientRect().height || 0) + "px");
root.style.setProperty("--section-local-h", (activeLocal?.getBoundingClientRect().height || 0) + "px");
const scrollY = Number(p.get("scroll"));
if (scrollY > 0) requestAnimationFrame(() => window.scrollTo(0, scrollY));
</script>
</body>
</html>
