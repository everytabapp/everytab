<!doctype html>
<html lang="en" data-scheme="cream" data-mode="light" data-emphasis="bold"
      data-checkbox-shape="round" data-corner-style="crisp" data-row-info="useful">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EveryTab side-panel harness</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/primitives.css" />
<link rel="stylesheet" href="../css/sidepanel.css?harness=p11-13r2" />
<link rel="stylesheet" href="../css/tablist-d4.css" />
</head>
<body data-surface="sidepanel">
<div id="panel">
  <div class="sidepanel-shell">
    <div class="panel-chrome">
      <div class="search-box">
        <div class="search-field">
          <span class="scope-chip-host"></span>
          <input class="search-input" value="" placeholder="Search everything: open, snoozed, archived, history…" />
        </div>
      </div>
      <div class="panel-focus">
        <div class="focus-strip">
          <span class="fs-dot"></span><span class="fs-name">Focus is on</span>
          <span class="fs-time">42 minutes left</span>
          <button class="fs-counts fs-counts-link">7 sites guarded</button>
          <div class="focus-access hidden">
            <span class="focus-access-head">Temporary access</span>
            <div class="focus-access-rows"><div class="focus-access-row">
              <span class="focus-access-domain">youtube.com</span><span class="focus-access-time">4:32 left</span>
              <span class="focus-access-actions"><button class="focus-access-stop">Stop</button>
                <button class="focus-access-add">Add 5 min</button></span>
            </div></div>
          </div>
        </div>
      </div>
      <div class="switcher">
        <div class="switcher-tabs" role="tablist" aria-label="Panel sections">
          <button class="switch-tab" role="tab" aria-selected="true">Open</button>
          <button class="switch-tab" role="tab" aria-selected="false">Inbox</button>
          <button class="switch-tab" role="tab" aria-selected="false">Sessions</button>
          <button class="switch-tab" role="tab" aria-selected="false">Labels</button>
        </div>
        <button class="switch-more" aria-label="More sections">More</button>
      </div>
    </div>
    <header class="panel-section-lead"><h2 class="panel-heading">Open tabs (15)</h2>
      <div class="panel-section-actions" data-panel-actions="open"></div></header>
    <div class="panel-body">
      <div class="panel-section-host">
        <div class="label-index section-local-sticky" id="label-index" hidden>
          <div class="label-index-bar"><input class="label-filter" placeholder="Filter labels…" />
            <span class="label-sort"><button class="seg on">A–Z</button><button class="seg">Most tabs</button><button class="seg">Recent</button></span></div>
          <div class="organization-row" aria-label="Label groups">
            <span class="organization-row-label">Groups</span>
            <div class="organization-lenses">
              <button class="organization-lens on"><span class="organization-lens-name">All</span><span class="organization-lens-count">57</span></button>
              <button class="organization-lens"><span class="organization-lens-name">Ungrouped</span><span class="organization-lens-count">52</span></button>
              <button class="organization-lens"><span class="organization-lens-name">Design</span><span class="organization-lens-count">1</span></button>
              <button class="organization-lens"><span class="organization-lens-name">Home</span><span class="organization-lens-count">2</span></button>
            </div>
            <span class="organization-row-actions"><button class="organization-command">+ Group</button></span>
          </div>
          <div class="label-chip-line"><div class="label-chip-viewport"><div class="label-chips">
            <button class="label-chip">design</button><button class="label-chip">research</button>
            <button class="label-chip">work</button><button class="label-chip">reading</button>
          </div></div></div>
        </div>
        <div class="tablist" data-compact data-tablist="open">
          <div class="item">
            <div class="item-head-shell"><div class="item-head">
              <input type="checkbox" aria-label="Select Window 1" />
              <button class="item-head-toggle"><span class="item-title">Window 1</span><span class="item-meta">9 tabs</span></button>
              <span class="gacts">
                <button class="mini iconbtn" aria-label="Save to Inbox" data-icon="inbox"></button>
                <button class="mini iconbtn" aria-label="Save as Session" data-icon="sessions"></button>
                <button class="mini iconbtn" aria-label="Copy links" data-icon="copy"></button>
                <button class="mini iconbtn" aria-label="Organize" data-icon="organize"></button>
              </span>
            </div></div>
            <div class="item-body-frame"><div class="tl-rows" id="rows-one"></div></div>
          </div>
          <div class="item">
            <div class="item-head-shell"><div class="item-head">
              <input type="checkbox" aria-label="Select Window 2" />
              <button class="item-head-toggle"><span class="item-title">Window 2</span><span class="item-meta">6 tabs</span></button>
              <span class="gacts">
                <button class="mini iconbtn" aria-label="Save to Inbox" data-icon="inbox"></button>
                <button class="mini iconbtn" aria-label="Save as Session" data-icon="sessions"></button>
                <button class="mini iconbtn" aria-label="Copy links" data-icon="copy"></button>
                <button class="mini iconbtn" aria-label="Organize" data-icon="organize"></button>
              </span>
            </div></div>
            <div class="item-body-frame"><div class="tl-rows" id="rows-two"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { icon } from "../js/ui/icons.js";
import { initTooltips } from "../js/ui/tooltip.js";
import {
  applyExpandedCopyFixture, applyFoldedPressureFixture, foldedPressureGeometry
} from "./sidepanel-fixtures.js";

initTooltips();

const params = new URLSearchParams(location.search);
const root = document.documentElement;
root.dataset.scheme = params.get("scheme") || "cream";
root.dataset.mode = params.get("mode") || "light";
const fixtureWidth = Number(params.get("width")) || 400;
const fixtureZoom = Math.max(100, Number(params.get("zoom")) || 100);
const layoutWidth = fixtureWidth / (fixtureZoom / 100);
document.body.style.width = `${layoutWidth}px`;
if (fixtureZoom !== 100) document.body.style.zoom = String(fixtureZoom / 100);
root.style.setProperty("--panel-gutter", layoutWidth >= 400 ? "12px" : "10px");
if (params.get("focus") === "0") document.querySelector(".panel-focus").replaceChildren();
if (params.get("access") === "1") document.querySelector(".focus-access")?.classList.remove("hidden");
if (params.get("view") === "labels") {
  document.getElementById("label-index").hidden = false;
  document.querySelector(".panel-heading").textContent = "Labels (12)";
  document.querySelectorAll(".switch-tab").forEach((button) =>
    button.setAttribute("aria-selected", String(button.textContent === "Labels")));
}
if (params.get("view") === "sessions") {
  document.querySelector(".panel-heading").textContent = "Sessions (4)";
  document.querySelector(".panel-section-actions").dataset.panelActions = "sessions";
  document.querySelector(".tablist").dataset.tablist = "sessions";
  const saveAll = document.createElement("button");
  saveAll.className = "section-session-save tip";
  saveAll.title = "Save every currently open browser window as a session, new or existing";
  saveAll.textContent = "Save all to session";
  document.querySelector(".panel-section-actions").append(saveAll);
  document.querySelectorAll(".switch-tab").forEach((button) =>
    button.setAttribute("aria-selected", String(button.textContent === "Sessions")));
  if (params.get("sessionHeader") === "1") {
    const lane = document.querySelector(".tablist > .item .gacts");
    const names = ["Restore", "Copy", "Label", "Groups", "Rename", "Snooze", "Delete"];
    lane.replaceChildren(...names.map((name) => {
      const button = document.createElement("button");
      button.className = `mini${name === "Delete" ? " danger" : ""}`;
      button.setAttribute("aria-label", name);
      button.dataset.actionId = name.toLowerCase();
      button.textContent = name.slice(0, 1);
      return button;
    }));
  }
}

document.querySelectorAll("[data-icon]").forEach((button) => {
  button.append(icon(button.dataset.icon, 14), Object.assign(document.createElement("span"), {
    className: "action-label", textContent: button.getAttribute("aria-label")
  }));
});

const titles = [
  "EveryTab side panel reference", "UI polish notes and visual audit", "Chrome Side Panel API",
  "Client review and roadmap", "Scheme contrast worksheet", "Search interaction details",
  "Onboarding copy pass", "Labels and session grouping", "Close the day workflow"
];
function row(title, index) {
  const selected = index === 2 ? " sel" : "";
  const sessionActions = params.get("view") === "sessions"
    ? `<button class="mini iconbtn move-handle" aria-label="Move">⠿</button>
      <button class="mini iconbtn" aria-label="Star">☆</button>
      <button class="mini iconbtn" aria-label="Label">◇</button>
      <button class="mini danger" aria-label="Remove from session">×</button>`
    : `<button class="mini iconbtn" aria-label="Save to Inbox">+</button>
      <button class="mini danger" aria-label="Close">×</button>`;
  return `<div class="trow selrow${selected}" tabindex="0">
    <span class="row-select-slot"><input type="checkbox" ${selected ? "checked" : ""} aria-label="Select ${title}"></span>
    <span class="fv-placeholder"></span>
    <span class="row-copy"><span class="t"><a href="#">${title}</a></span>
      <span class="row-subline"><span class="host">example.com</span></span></span>
    <span class="row-chip-slot"><span class="rowchips"><span class="chip">work</span></span></span>
    <span class="tacts">${sessionActions}</span>
  </div><div></div>`;
}
document.getElementById("rows-one").innerHTML = titles.map(row).join("");
document.getElementById("rows-two").innerHTML = titles.slice(0, 6).map((title, i) => row(title, i + 9)).join("");
if (params.get("view") === "sessions") {
  const pressureTitle = "A deliberately extremely long saved-session tab title that must never hide its complete action tray at compact panel widths";
  document.querySelector("#rows-one .trow .t a").textContent = pressureTitle;
  document.querySelector("#rows-one .trow").classList.add("session-action-pressure", "kbd-reveal");
}
if (params.get("copy") === "expanded") applyExpandedCopyFixture(document);
if (params.get("folded") === "1") applyFoldedPressureFixture(document);

const chrome = document.querySelector(".panel-chrome");
const lead = document.querySelector(".panel-section-lead");
function measure() {
  const local = document.querySelector(".section-local-sticky:not([hidden])");
  root.style.setProperty("--panel-chrome-h", `${chrome.getBoundingClientRect().height}px`);
  root.style.setProperty("--panel-section-lead-h", `${lead.getBoundingClientRect().height}px`);
  root.style.setProperty("--panel-local-h", `${local?.getBoundingClientRect().height || 0}px`);
}
new ResizeObserver(measure).observe(chrome);
new ResizeObserver(measure).observe(lead);
const local = document.querySelector(".section-local-sticky:not([hidden])");
if (local) new ResizeObserver(measure).observe(local);
measure();
if (params.get("folded") === "1") {
  const publishPressureResult = () => {
    const result = foldedPressureGeometry(document, { zoom: fixtureZoom });
    const output = document.getElementById("pressure-result") || document.createElement("pre");
    output.id = "pressure-result";
    output.hidden = true;
    output.textContent = JSON.stringify(result);
    if (!output.isConnected) document.body.append(output);
    root.dataset.pressureStatus = result.pass ? "pass" : "fail";
    root.dataset.pressureWidth = String(fixtureWidth);
    root.dataset.pressureZoom = String(fixtureZoom);
  };
  publishPressureResult();
  requestAnimationFrame(() => requestAnimationFrame(publishPressureResult));
}
if (params.get("sessionHeader") === "1") {
  const publishSessionPressureResult = () => {
    const card = document.querySelector('.tablist[data-tablist="sessions"] > .item');
    const head = card?.querySelector(":scope > .item-head-shell > .item-head");
    const actions = head?.querySelector(":scope > .gacts");
    const buttons = [...(actions?.querySelectorAll("button") ?? [])];
    const headRect = head?.getBoundingClientRect();
    const actionsRect = actions?.getBoundingClientRect();
    const epsilon = 1;
    const result = {
      pass: Boolean(card && head && actions && buttons.length === 7 &&
        buttons.every((button) => button.getBoundingClientRect().width >= 27) &&
        actionsRect.left >= headRect.left - epsilon &&
        actionsRect.right <= headRect.right + epsilon &&
        actionsRect.bottom <= headRect.bottom + epsilon &&
        card.scrollWidth <= card.clientWidth + epsilon),
      buttonCount: buttons.length,
      overflow: card ? Math.max(0, card.scrollWidth - card.clientWidth) : null,
      head: headRect ? [headRect.left, headRect.right, headRect.top, headRect.bottom] : null,
      actions: actionsRect ? [actionsRect.left, actionsRect.right, actionsRect.top, actionsRect.bottom] : null
    };
    const output = document.getElementById("session-pressure-result") || document.createElement("pre");
    output.id = "session-pressure-result";
    output.hidden = true;
    output.textContent = JSON.stringify(result);
    if (!output.isConnected) document.body.append(output);
  };
  publishSessionPressureResult();
  requestAnimationFrame(() => requestAnimationFrame(publishSessionPressureResult));
}
if (params.get("view") === "labels") {
  const publishGroupNavResult = () => {
    const row = document.querySelector(".organization-row");
    const lenses = row?.querySelector(".organization-lenses");
    const lens = row?.querySelector(".organization-lens");
    const actions = row?.querySelector(".organization-row-actions");
    const rowStyle = row ? getComputedStyle(row) : null;
    const lensStyle = lens ? getComputedStyle(lens) : null;
    const line = lens ? getComputedStyle(lens, "::after") : null;
    const result = {
      pass: Boolean(row && lenses && lens && actions &&
        rowStyle.display === "flex" && getComputedStyle(lenses).display === "flex" &&
        ["flex", "inline-flex"].includes(lensStyle.display) && lensStyle.borderLeftWidth === "0px" &&
        lensStyle.borderRadius === "0px" && Number.parseFloat(lensStyle.columnGap) >= 4 &&
        ["flex", "inline-flex"].includes(getComputedStyle(actions).display) &&
        row.scrollWidth <= row.clientWidth + 1),
      rowDisplay: rowStyle?.display ?? null,
      lensesDisplay: lenses ? getComputedStyle(lenses).display : null,
      lensDisplay: lensStyle?.display ?? null,
      lensBorder: lensStyle?.border ?? null,
      lensRadius: lensStyle?.borderRadius ?? null,
      lensGap: lensStyle?.columnGap ?? null,
      actionDisplay: actions ? getComputedStyle(actions).display : null,
      overflow: row ? Math.max(0, row.scrollWidth - row.clientWidth) : null,
      lineContent: line?.content ?? null
    };
    const output = document.getElementById("group-nav-result") || document.createElement("pre");
    output.id = "group-nav-result";
    output.hidden = true;
    output.textContent = JSON.stringify(result);
    if (!output.isConnected) document.body.append(output);
  };
  publishGroupNavResult();
  requestAnimationFrame(() => requestAnimationFrame(publishGroupNavResult));
}
</script>
</body>
</html>
