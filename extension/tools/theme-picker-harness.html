<!doctype html>
<html lang="en" data-scheme="cream" data-mode="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/primitives.css" />
<link rel="stylesheet" href="../css/dashboard.css" />
<link rel="stylesheet" href="../css/settings-schemes.css" />
<style>
  body { margin: 0; background: var(--bg-solid); }
  .app { min-height: 720px; }
  .sidebar { min-height: 720px; }
  .content { min-height: 720px; background: var(--bg-solid); }
  .hero { height: 180px; }
  .theme-pop { top: 40px; bottom: auto; max-height: 640px; }
  .scheme-favorites { position: fixed; left: 6px; bottom: 6px; width: min(408px, calc(100vw - 12px)); }
</style>
</head>
<body>
<div id="app">
  <div class="app">
    <aside class="sidebar"></aside>
    <main class="content"><div class="hero"><div class="hero-panel"></div></div></main>
  </div>
  <div class="theme-pop" role="menu" aria-label="Color scheme">
    <div class="theme-quadrants" role="presentation">
      <div class="theme-quadrant" role="group" aria-label="Light default · Soft">
        <div class="theme-group-label" role="presentation">Light default · Soft</div>
        <div class="theme-quadrant-options" role="presentation">
          <div class="theme-opt-row" role="none"><button class="theme-opt on" role="menuitemradio" aria-checked="true" title="Cream"><span class="sw" style="background:#bc5f3c"></span><span class="theme-opt-label">Cream</span></button><button class="theme-star on" type="button" aria-label="Remove favorite">★</button></div>
          <div class="theme-opt-row" role="none"><button class="theme-opt" role="menuitemradio" aria-checked="false" title="A deliberately very long scheme name"><span class="sw" style="background:#39789a"></span><span class="theme-opt-label">A deliberately very long scheme name</span></button><button class="theme-star" type="button" aria-label="Add favorite">☆</button></div>
        </div>
      </div>
      <div class="theme-quadrant" role="group" aria-label="Light default · Vivid">
        <div class="theme-group-label" role="presentation">Light default · Vivid</div>
        <div class="theme-quadrant-options" role="presentation">
          <div class="theme-opt-row" role="none"><button class="theme-opt" role="menuitemradio" aria-checked="false" title="Frozen Llama"><span class="sw" style="background:#0f638f"></span><span class="theme-opt-label">Frozen Llama</span></button><button class="theme-star" type="button" aria-label="Add favorite">☆</button></div>
        </div>
      </div>
      <div class="theme-quadrant" role="group" aria-label="Dark default · Soft">
        <div class="theme-group-label" role="presentation">Dark default · Soft</div>
        <div class="theme-quadrant-options" role="presentation">
          <div class="theme-opt-row" role="none"><button class="theme-opt" role="menuitemradio" aria-checked="false" title="Chocolatier"><span class="sw" style="background:#d9a441"></span><span class="theme-opt-label">Chocolatier</span></button><button class="theme-star" type="button" aria-label="Add favorite">☆</button></div>
        </div>
      </div>
      <div class="theme-quadrant" role="group" aria-label="Dark default · Vivid">
        <div class="theme-group-label" role="presentation">Dark default · Vivid</div>
        <div class="theme-quadrant-options" role="presentation">
          <div class="theme-opt-row" role="none"><button class="theme-opt" role="menuitemradio" aria-checked="false" title="Miami Nights"><span class="sw" style="background:#ff3d9a"></span><span class="theme-opt-label">Miami Nights</span></button><button class="theme-star" type="button" aria-label="Add favorite">☆</button></div>
        </div>
      </div>
    </div>
  </div>
  <details class="scheme-favorites" open>
    <summary>All 36 schemes</summary>
    <div class="scheme-favorites-grid">
      <section class="scheme-category"><div class="scheme-category-label">Light default · Soft</div><div class="scheme-category-options"><button class="scheme-favorite" title="A deliberately very long scheme name"><span class="scheme-star" aria-hidden="true">☆</span><span class="scheme-swatch" style="background:#39789a"></span><span class="scheme-favorite-label">A deliberately very long scheme name</span></button></div></section>
      <section class="scheme-category"><div class="scheme-category-label">Light default · Vivid</div><div class="scheme-category-options"><button class="scheme-favorite" title="Frozen Llama"><span class="scheme-star" aria-hidden="true">☆</span><span class="scheme-swatch" style="background:#0f638f"></span><span class="scheme-favorite-label">Frozen Llama</span></button></div></section>
      <section class="scheme-category"><div class="scheme-category-label">Dark default · Soft</div><div class="scheme-category-options"><button class="scheme-favorite" title="Chocolatier"><span class="scheme-star" aria-hidden="true">☆</span><span class="scheme-swatch" style="background:#d9a441"></span><span class="scheme-favorite-label">Chocolatier</span></button></div></section>
      <section class="scheme-category"><div class="scheme-category-label">Dark default · Vivid</div><div class="scheme-category-options"><button class="scheme-favorite" title="Miami Nights"><span class="scheme-star" aria-hidden="true">☆</span><span class="scheme-swatch" style="background:#ff3d9a"></span><span class="scheme-favorite-label">Miami Nights</span></button></div></section>
    </div>
  </details>
</div>
  <pre id="theme-picker-result"></pre>
  <script>
    const edge = 6;
    const requestedWidth = Number(new URLSearchParams(location.search).get("width")) || innerWidth;
    document.documentElement.dataset.nav = requestedWidth <= 720 ? "header" : "expanded";
    document.body.style.width = `${requestedWidth}px`;
    const pop = document.querySelector(".theme-pop");
    document.querySelector(".scheme-favorites").style.width =
      `${Math.round(Math.min(408, requestedWidth - edge * 2))}px`;
    pop.style.width = `${Math.round(Math.min(408, requestedWidth - edge * 2))}px`;
    pop.style.left = `${edge}px`;
    let clicked = "";
    for (const [index, option] of [...document.querySelectorAll(".theme-opt")].entries()) {
      option.addEventListener("click", () => { clicked = String(index); });
    }
    setTimeout(() => {
      const rows = [...document.querySelectorAll(".theme-opt-row")];
      const rowChecks = rows.map((row) => {
        const label = row.querySelector(".theme-opt-label");
        const star = row.querySelector(".theme-star");
        const labelRect = label.getBoundingClientRect();
        const starRect = star.getBoundingClientRect();
        return {
          noOverlap: labelRect.right <= starRect.left + 0.5,
          oneLine: getComputedStyle(label).whiteSpace === "nowrap" &&
            labelRect.height <= Number.parseFloat(getComputedStyle(label).lineHeight) + 1,
          starWidth: Math.round(starRect.width),
          noRowOverflow: row.scrollWidth <= row.clientWidth
        };
      });
      const favorite = document.querySelector(".scheme-favorite-label");
      const target = rows[1].querySelector(".theme-opt");
      const targetRect = target.getBoundingClientRect();
      const hit = document.elementFromPoint(
        targetRect.left + targetRect.width / 2,
        targetRect.top + targetRect.height / 2
      );
      hit?.click();
      const result = {
        width: requestedWidth,
        popWidth: Math.round(pop.getBoundingClientRect().width),
        quadrantColumns: getComputedStyle(document.querySelector(".theme-quadrants")).gridTemplateColumns.split(" ").length,
        favoriteColumns: getComputedStyle(document.querySelector(".scheme-favorites-grid")).gridTemplateColumns.split(" ").length,
        quadrantLabels: [...document.querySelectorAll(".theme-quadrant .theme-group-label")].map((node) => node.textContent),
        rows: rowChecks,
        portalParent: pop.parentElement?.id,
        secondOptionHit: hit?.closest?.(".theme-opt") === target,
        secondOptionClicked: clicked === "1",
        favoriteOneLine: getComputedStyle(favorite).whiteSpace === "nowrap" &&
          favorite.getBoundingClientRect().height <= Number.parseFloat(getComputedStyle(favorite).lineHeight) + 1,
        documentOverflow: Math.max(0,
          pop.getBoundingClientRect().right - requestedWidth,
          document.querySelector(".scheme-favorites").getBoundingClientRect().right - requestedWidth)
      };
      result.pass = result.popWidth <= requestedWidth - edge * 2 + 1 &&
        result.rows.every((row) => row.noOverlap && row.oneLine && row.starWidth === 28 && row.noRowOverflow) &&
        result.quadrantColumns === 2 && result.quadrantLabels.join("|") ===
          "Light default · Soft|Light default · Vivid|Dark default · Soft|Dark default · Vivid" &&
        result.portalParent === "app" && result.secondOptionHit && result.secondOptionClicked &&
        result.favoriteOneLine && result.documentOverflow <= 0;
      document.getElementById("theme-picker-result").textContent = JSON.stringify(result);
    }, 0);
  </script>
</body>
</html>
