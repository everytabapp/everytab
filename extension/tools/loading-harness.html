<!doctype html>
<html lang="en" data-scheme="cream" data-mode="light" data-emphasis="bold"
      data-checkbox-shape="round" data-corner-style="crisp" data-row-info="useful">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EveryTab Loading feedback harness</title>
<link rel="stylesheet" href="../css/tokens.css?v=286" />
<link rel="stylesheet" href="../css/primitives.css?v=286" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; }
  main { display: grid; gap: 16px; max-width: 720px; margin: 0 auto; }
  section { padding: 12px; background: var(--surface); border: var(--bw) solid var(--border); }
  h2 { margin: 0; color: var(--ink); font-size: var(--text-body); }
  .fixture { min-height: 64px; }
</style>
</head>
<body>
<main>
  <section data-scheme="cream" data-mode="light">
    <h2>Cold side-panel section</h2>
    <div class="fixture" aria-busy="true">
      <div class="loading-feedback" aria-hidden="true">Loading sessions…</div>
    </div>
  </section>
  <section data-scheme="ink" data-mode="dark">
    <h2>Explicit operation</h2>
    <div class="fixture" aria-busy="true">
      <div class="loading-feedback" aria-hidden="true">Loading history suggestions…</div>
    </div>
  </section>
  <section data-scheme="cream" data-mode="light">
    <h2>Main-thread pressure regression</h2>
    <button id="run-starvation" type="button">Run blocked render</button>
    <div id="starvation-fixture" class="fixture"></div>
  </section>
</main>
<script type="module">
  import { showLoadingFeedback } from "../js/ui/loading.js?v=286";

  const host = document.getElementById("starvation-fixture");
  document.getElementById("run-starvation").addEventListener("click", () => {
    host.replaceChildren();
    const startedAt = performance.now();
    const loading = showLoadingFeedback(host, { label: "Loading open tabs…" });
    window.loadingStarvationState = { startedAt, completedAt: null };
    setTimeout(() => {
      const blockUntil = performance.now() + 1000;
      while (performance.now() < blockUntil) { /* deterministic old-profile render pressure */ }
      host.replaceChildren("Open tabs loaded");
      loading.stop();
      window.loadingStarvationState.completedAt = performance.now();
    }, 120);
  });
</script>
</body>
</html>
