<!DOCTYPE html>
<html lang="en" data-scheme="ink" data-mode="light" data-emphasis="bold"
      data-interface-style="soft" data-row-info="detailed" data-action-labels="icons">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <script src="js/boot.js"></script>
  <title></title>
  <link rel="stylesheet" href="css/tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      cursor: pointer;
      user-select: none;
    }
    .card {
      text-align: center;
      max-width: 520px;
      padding: 48px 36px;
    }
    /* F12: the EveryTab stack mark is the "suspended by EveryTab" signature,
       replacing the old 💤 emoji (an AI tell, off the Editor-Theme register). */
    .mark {
      display: flex;
      justify-content: center;
      color: var(--brand-accent);
      margin-bottom: 18px;
    }
    .brand {
      font: var(--label-weight, 700) 11px/1 var(--font-display);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 22px;
    }
    .favicon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      margin-bottom: 14px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: var(--display-weight);
      letter-spacing: var(--display-tracking);
      font-size: 20px;
      color: var(--ink);
      margin: 0 0 10px;
      line-height: 1.3;
      word-break: break-word;
    }
    .url {
      font-size: 12px;
      color: var(--ink-3);
      word-break: break-all;
      margin-bottom: 32px;
    }
    .wake-btn {
      padding: 10px 32px;
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: var(--r-btn);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      box-shadow: var(--btn-glow);
      transition: filter var(--motion-feedback) var(--ease-out);
    }
    .wake-btn:hover { filter: brightness(1.08); }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: var(--ink-3);
    }
</style>
<link rel="stylesheet" href="css/interface-style.css" />
</head>
<body>
  <div class="card">
    <div class="mark" id="mark-wrap"></div>
    <div class="brand" id="brand"></div>
    <div id="favicon-wrap"></div>
    <h1 id="title"></h1>
    <div class="url" id="url"></div>
    <button class="wake-btn" id="wake-btn"></button>
    <div class="hint" id="hint"></div>
  </div>
  <script type="module" src="js/ui/suspend-page.js"></script>
</body>
</html>
