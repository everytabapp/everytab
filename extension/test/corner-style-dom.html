<!doctype html>
<html lang="en" data-scheme="ink" data-mode="light" data-interface-style="soft"
      data-row-info="detailed">
<head>
  <meta charset="utf-8">
  <title>Interface style computed contract</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/tablist-d4.css">
  <link rel="stylesheet" href="../css/interface-style.css">
  <style>
    body { margin: 0; padding: 8px; }
    #fixtures { display: grid; gap: 8px; }
    .surface-host { display: block; width: min(100%, 760px); }
    #result { position: fixed; right: 2px; bottom: 2px; z-index: 200; max-width: 70vw; }
  </style>
</head>
<body>
  <pre id="result">RUNNING</pre>
  <div class="tablist"><div class="trow">
    <span class="row-select-slot"><input id="global-checkbox" type="checkbox" aria-label="Selection grammar"></span>
    <span></span><span class="row-copy">Selection fixture</span><span></span><span></span>
  </div></div>
  <main id="fixtures"></main>
  <script>
    const reportFailure = (reason) => {
      const node = document.querySelector("#result");
      node.dataset.status = "fail";
      node.textContent = reason?.stack || reason?.message || String(reason);
    };
    addEventListener("error", (event) => reportFailure(event.error || event.message));
    addEventListener("unhandledrejection", (event) => reportFailure(event.reason));
  </script>
  <script type="module" src="./corner-style-dom-page.mjs"></script>
</body>
</html>
