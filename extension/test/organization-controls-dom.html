<!doctype html>
<html data-scheme="cream" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/primitives.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/tablist-d4.css">
  <style>
    body { margin: 0; background: var(--bg-solid); color: var(--ink); }
    #host { box-sizing: border-box; width: min(100%, 800px); padding: 12px; }
    #result { white-space: pre-wrap; }
  </style>
</head>
<body>
  <main id="host"></main>
  <pre id="result" data-status="pending">RUNNING</pre>
  <script>
    const reportFailure = (reason) => {
      const result = document.querySelector("#result");
      result.dataset.status = "fail";
      result.textContent = `FAIL: ${reason?.stack || reason?.message || reason}`;
    };
    addEventListener("error", (event) => reportFailure(event.error || event.message));
    addEventListener("unhandledrejection", (event) => reportFailure(event.reason));
  </script>
  <script type="module" src="organization-controls-dom-page.mjs"></script>
</body>
</html>
