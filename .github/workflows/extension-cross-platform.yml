name: Extension cross-platform

on:
  pull_request:
    paths:
      - "extension/**"
      - "tools/**"
      - "test-inventory.json"
      - ".github/workflows/extension-cross-platform.yml"
  push:
    paths:
      - "extension/**"
      - "tools/**"
      - "test-inventory.json"
      - ".github/workflows/extension-cross-platform.yml"
  workflow_dispatch:
    inputs:
      package_checks:
        description: "Run package checks only after explicit release authorization"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  portable-contracts:
    name: Portable contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Portable contracts from the shared inventory
        run: node tools/test.mjs --lane portable --ci
      - name: Stable performance budgets
        if: runner.os == 'Linux'
        run: node tools/test.mjs --lane performance --ci

  installed-chrome:
    name: Installed Chrome (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EVERYTAB_CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Declared browser variants (Linux)
        if: runner.os == 'Linux'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a node tools/test.mjs --lane browser --ci
      - name: Declared browser variants (Windows and macOS)
        if: runner.os != 'Linux'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/test.mjs --lane browser --ci

  package-checks:
    name: Explicitly authorized package checks
    if: github.event_name == 'workflow_dispatch' && inputs.package_checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Package-only checks from the shared inventory
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          EVERYTAB_CHROME_NO_SANDBOX: "1"
          EVERYTAB_STABLE_EXTENSION_TARGET: "1"
        run: xvfb-run -a node tools/test.mjs --lane package --allow-packaging --ci
