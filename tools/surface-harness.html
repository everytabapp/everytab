<!doctype html>
<html lang="en" data-scheme="cream" data-mode="light" data-emphasis="bold"
      data-interface-style="crisp" data-row-info="useful">
<head>
<meta charset="utf-8" />
<title>EveryTab surface harness</title>
<!--
  D4 VISUAL HARNESS for the popup and the Focus guard page. Companion to
  shell-harness.html, which covers the Dashboard shell.

  Those two surfaces keep their CSS INLINE in their own documents, so this page
  does not copy it: it fetches the real document, lifts its <style> block out,
  and injects it. The stylesheet under test is therefore always the shipped one.
  Only the markup is mirrored, from js/ui/popup.js and js/ui/focus-page.js.

    python3 -m http.server 8765
    http://localhost:8765/tools/surface-harness.html?surface=popup
    http://localhost:8765/tools/surface-harness.html?surface=focus
    http://localhost:8765/tools/surface-harness.html?surface=newtab

  Params: surface=popup|focus|newtab, scheme=, mode=, emphasis=, corner=,
          state=default|disabled|unsupported|panel|search|feedback|pause|expired

  It carries NO product logic. If markup here drifts from the real renderers,
  the harness is wrong, not the product. A harness finding is a lead, not
  evidence: confirm it against the actual renderer before changing production CSS.
-->
<link rel="stylesheet" href="../extension/css/tokens.css" />
<script>
  document.write('<link rel="stylesheet" href="../extension/css/primitives.css?t=' + Date.now() + '" />');
  document.write('<link rel="stylesheet" href="../extension/css/interface-style.css?t=' + Date.now() + '" />');
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
import { icon } from "../extension/js/ui/icons.js";

const p = new URLSearchParams(location.search);
const root = document.documentElement;
for (const [key, attr] of [["scheme", "scheme"], ["mode", "mode"],
  ["emphasis", "emphasis"], ["corner", "cornerStyle"]]) {
  if (p.get(key)) root.dataset[attr] = p.get(key);
}
const surface = p.get("surface") === "focus" ? "focus"
  : p.get("surface") === "newtab" ? "newtab" : "popup";
const state = p.get("state") || "default";

/* Lift the shipped inline stylesheet out of the real document. */
const doc = await fetch(`../extension/${surface}.html?t=${Date.now()}`).then((r) => r.text());
if (surface === "newtab") {
  document.head.appendChild(Object.assign(document.createElement("link"), {
    rel: "stylesheet", href: `../extension/css/newtab.css?t=${Date.now()}`
  }));
} else {
  const style = doc.slice(doc.indexOf("<style>") + 7, doc.indexOf("</style>"));
  document.head.appendChild(Object.assign(document.createElement("style"), { textContent: style }));
}

const h = (html) => html;
const ICON = (n, s = 15) => icon(n, s).outerHTML;
const app = document.getElementById("app");

if (surface === "popup") {
  document.body.style.minWidth = "0";
  const w = Number(p.get("w")) || 380;
  app.style.maxWidth = w + "px";
  const unsupported = state === "unsupported";
  const disabled = state === "disabled" || unsupported ? " disabled" : "";
  const reason = state === "disabled" || unsupported
    ? '<div class="reason">Chrome doesn\'t let extensions touch this page.</div>' : "";
  const panel = state === "panel"
    ? '<div class="panel snooze-panel"><button class="snooze-opt">Later today</button>' +
      '<button class="snooze-opt">This evening</button>' +
      '<button class="snooze-opt">Tomorrow morning</button></div>' : "";
  const feedback = state === "feedback"
    ? '<div class="msg popup-msg">Saved 12 tabs to Inbox<button class="linkbtn">Undo</button></div>'
    : '<div class="msg popup-msg"></div>';
  const searchPanel = state === "search"
    ? '<div class="search-results"><div class="search-option-list" role="listbox" aria-label="Search results">' +
      '<div class="search-option-group search-result-group" role="group" aria-label="Results">' +
      '<div class="search-row selected" role="option"><span class="rtitle">Client review</span>' +
      '<span class="rmeta rmeta-count">3 windows · 18 tabs</span><span class="rtype rtype-session-entity">Restore</span></div>' +
      '<div class="search-row" role="option"><span class="rtitle">Calm Precision design system specification</span>' +
      '<span class="rmeta">open</span><span class="rtype rtype-open">Switch</span></div>' +
      '<div class="search-row" role="option"><span class="rtitle">EveryTab backlog</span>' +
      '<span class="rmeta">inbox</span><span class="rtype">Open</span></div>' +
      '</div></div></div>' : "";
  app.innerHTML = h(`
    <div class="search-box"><div class="search-field">
      <span class="scope-chip-host"></span>
      <input class="search-input" placeholder="Search everything…" />
    </div>${searchPanel}</div>
    <div class="banner">
      <img class="fav" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
      <div class="banner-body"><div class="btext">Already open in this window</div>
        <button class="off">Don't tell me again</button></div>
      <button class="primary">Switch to it</button>
      <button class="x" aria-label="Dismiss">&times;</button>
    </div>
    <div class="banner warn"><div class="btext">Vault sync didn't complete</div>
      <button>Review</button></div>
    <div class="statusstrip">147 tabs <span class="sep">·</span> 3 windows
      <span class="sep">·</span> <a>Inbox 38</a> <span class="sep">·</span> <a>4 due today</a></div>

    <div class="group">
      <div class="tabhead"><h2 class="group-head">This tab</h2><span class="fav"></span>
        <span class="th-title">Calm Precision design system specification</span>
        <button class="tab-star is-starred" title="Unstar this tab" aria-label="Unstar this tab" aria-pressed="true">${ICON("star")}</button></div>
      <div class="tablabels"><span class="tl-lead">Labels:</span>
        <button class="chip labelchip">reading list</button>
        <button class="chip labelchip">work</button>
        <button class="tablabels-more">+2</button></div>
      <div class="actgrid tab-actions"${unsupported ? " hidden" : ""}>
        <button${disabled}>${ICON("inbox")}<span class="lbl">Save to Inbox</span><span class="k">I</span></button>
        <button${disabled}>${ICON("snooze")}<span class="lbl">Snooze…</span><span class="k">S</span></button>
        <button${disabled}>${ICON("labels")}<span class="lbl">Label…</span><span class="k">L</span></button>
        <button${disabled}>${ICON("suspend")}<span class="lbl">Suspend</span><span class="k">Z</span></button></div>
      ${panel}
      ${reason}
    </div>

    <div class="group">
      <div class="group-title-row"><h2 class="group-head">This window</h2>
        <button class="group-utility"${disabled}>${ICON("copy",14)}<span class="lbl">Copy links</span></button></div>
      <div class="actions-row">
        <button class="window-save"${disabled}>${ICON("inbox",16)}<span class="lbl">Save window to Inbox</span></button></div>
      <div class="actgrid">
        <button${disabled}>${ICON("sessions")}<span class="lbl">Save as session</span></button>
        <button${disabled}>${ICON("snooze")}<span class="lbl">Snooze…</span></button>
        <button${disabled}>${ICON("suspend")}<span class="lbl">Suspend others</span></button>
        <button${disabled}>${ICON("organize")}<span class="lbl">Sort…</span></button></div>
    </div>

    ${feedback}

    <div class="group">
      <div class="group-title-row focus-title-row"><h2 class="group-head">Focus</h2>
        <span class="focus-inline-status on">42 minutes left · 7 sites guarded</span>
        <button class="focus-end">End focus</button></div>
      <div class="focus-access popup-focus-access" aria-label="Temporary site access">
        <span class="focus-access-head">Temporary access</span>
        <div class="focus-access-rows"><div class="focus-access-row">
          <span class="focus-access-domain">youtube.com</span>
          <span class="focus-access-time">4:32 left</span>
          <span class="focus-access-actions"><button class="focus-access-stop">Stop</button><button class="focus-access-add">Add 5 min</button></span>
        </div></div>
      </div>
    </div>

    <div class="group duplicates-group">
      <div class="group-title-row"><h2 class="group-head">Duplicates</h2>
        <button class="group-utility">${ICON("duplicates",14)}<span class="lbl">See duplicates</span></button></div>
      <div class="actions-row"><button class="primary duplicate-close">Close 6 duplicate tabs</button></div>
    </div>

    <div class="linkrow"><button class="quiet">Side panel</button>
      <button class="quiet">Dashboard</button><button class="quiet">Settings</button></div>
  `);
  app.querySelector(".tabhead .fav").appendChild(icon("open", 16));
} else if (surface === "focus") {
  const paused = state === "pause";
  const expired = state === "expired";
  app.innerHTML = h(`
    <div class="card" role="main">
      <div class="mark" id="mark-wrap"></div>
      <div class="brand">EveryTab Focus</div>
      <h1>${expired ? "Time's up on this site" : "Focus is on"}</h1>
      <p class="line">You asked EveryTab to guard
        <span class="domain">news.ycombinator.com</span> during Focus.</p>
      <div><button class="primary"${paused ? " disabled" : ""}>
        ${paused ? "Continue in 7 seconds" : "Back to focus"}</button></div>
      <div class="access">
        <div class="access-label">Need a moment on this site?</div>
        <div class="access-row">
          <button class="mini"${paused ? " disabled" : ""}>5 minutes</button>
          <button class="mini"${paused ? " disabled" : ""}>10 minutes</button>
          <button class="mini"${paused ? " disabled" : ""}>15 minutes</button>
          <button class="mini"${paused ? " disabled" : ""}>30 minutes</button>
        </div>
      </div>
      ${expired ? `<div class="panel">
        <div class="panel-q">What should EveryTab do with this page?</div>
        <div class="panel-actions">
          <button class="mini">Close without saving</button>
          <button class="primary">Save to Inbox and close</button>
          <button class="quiet">Cancel</button>
        </div></div>` : ""}
      <div class="msg">${expired ? "" : "Saved to Inbox, but the tab stayed open."}</div>
      <div class="footer"><a class="linklike" href="#">Focus settings</a></div>
    </div>
  `);
  app.querySelector("#mark-wrap").appendChild(icon("mark", 28));
} else {
  app.innerHTML = h(`
    <div class="clock">10:36</div>
    <div class="date">Saturday, August 8</div>
    <div class="search-box"><div class="search-field">
      <span class="scope-chip-host"></span>
      <input class="search-input" placeholder="Search everything you've saved…" />
    </div></div>
    <div class="focus-access newtab-focus-access" aria-label="Temporary site access">
      <span class="focus-access-head">Temporary access</span>
      <div class="focus-access-rows"><div class="focus-access-row">
        <span class="focus-access-domain">youtube.com</span>
        <span class="focus-access-time">4:32 left</span>
        <span class="focus-access-actions"><button class="focus-access-stop">Stop</button><button class="focus-access-add">Add 5 min</button></span>
      </div></div>
    </div>
    <div class="links"><a>Dashboard</a><button>Settings</button></div>
  `);
}
</script>
</body>
</html>
